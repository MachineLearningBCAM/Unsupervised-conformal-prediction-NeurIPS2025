[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unsupervised-conformal-calibration"
version = "0.1.0"
description = "Split conformal classification with unlabeled calibration examples"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "osqp>=1.0"]

[project.optional-dependencies]
examples = ["scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["python/src"]
